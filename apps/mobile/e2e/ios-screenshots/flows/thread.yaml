appId: com.rakazo.app
name: Thread
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
- openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*The fixture workspace is ready.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-thread
- scrollUntilVisible:
    element: ".*launch-notes.txt.*"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 40
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-attachment
# 01-thread shows the empty composer (mic and Call); a typed draft swaps Call for Send.
- tapOn: "Message Researcher"
- inputText: "Summarize the launch notes"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02b-composer-typed
- eraseText: 40
- hideKeyboard
- openLink: "rakazo:///group-thread?groupId=${RAKAZO_SCREENSHOT_GROUP_ID}&name=Launch%20team"
# The newest reply places its visual and image between its sentences.
- extendedWaitUntil:
    visible: ".*The picture is the same rise.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-group-thread
# A cited research answer: pills after the sentence, a placed image with its site, the sources pill.
- scrollUntilVisible:
    element: ".*24 hours and 37 minutes.*"
    direction: UP
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03b-research-answer
- openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*The fixture workspace is ready.*"
    timeout: 20000
- longPressOn:
    text: ".*The fixture workspace is ready.*"
- extendedWaitUntil:
    visible: ".*Reply.*"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: ".*Reply.*"
    commands:
      - assertVisible: ".*Copy.*"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: 04-message-actions
      - tapOn: "Copy"
- openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
- scrollUntilVisible:
    element: ".*launch-notes.txt.*"
    direction: DOWN
    timeout: 15000
- tapOn: ".*launch-notes.txt.*"
- extendedWaitUntil:
    visible: ".*Collect three customer quotes.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-attachment-preview
# The catalog's offline billing has invites on, so the Pro account always sees the gift.
- openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
- tapOn: "Invite a friend"
- extendedWaitUntil:
    visible: ".*2 weeks free.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-invite
# Long-pressing a quote opens a menu for just that quote.
- openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*Customers want export.*"
    timeout: 20000
- longPressOn:
    text: ".*Customers want export.*"
- extendedWaitUntil:
    visible: "Copy as Markdown"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 07-quote-actions
- tapOn: "Copy as Markdown"
# The seeded visuals fit the chat, so they work in place and show no full-screen button.
# The message-flow reply is taller than the screen (its diagram is part of the same element),
# so a partial match is enough; the fitting visual is the next card down.
- openLink: "rakazo:///group-thread?groupId=${RAKAZO_SCREENSHOT_GROUP_ID}&name=Launch%20team"
- extendedWaitUntil:
    visible: "Message Launch team"
    timeout: 20000
- scrollUntilVisible:
    element: ".*Here is how a message flows.*"
    direction: UP
    timeout: 30000
    visibilityPercentage: 20
- scrollUntilVisible:
    element:
      id: "visual-card"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: "Expand Launch path"
- assertNotVisible: "Expand Quarter trend"
- takeScreenshot: 08-visual
# A ui fence in the reply draws as a visual on the chat background, with no frame.
- scrollUntilVisible:
    element: ".*turns density estimation into classification.*"
    direction: UP
    timeout: 30000
    visibilityPercentage: 100
    centerElement: false
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08b-answer-fence
# A tap on the card acts in place and opens no sheet. The copy control lives in the page,
# so the catalog does not depend on reading it.
- tapOn:
    id: "visual-card"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: "Close"
- assertNotVisible: "Expand Launch path"
- takeScreenshot: 09-visual
